# Default flex1500d configuration. Command-line settings override this file.

[daemon]
enabled=true

[radio]
# offline, receive, rx-tuning, or transmit. Transmit must be deliberately set.
mode=rx-tuning

[http]
# The API is unauthenticated. Restrict this port to a trusted LAN by firewall.
bind=0.0.0.0
port=15000
test_page=false

[rtl_tcp]
# Experimental RX-only compatibility listener; disabled while under test.
enabled=false
bind=0.0.0.0
port=1234
